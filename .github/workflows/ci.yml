name: Amatarashu CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-validation:
    name: Backend CI (Python FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'stress-detection-system/backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r stress-detection-system/backend/requirements.txt

      - name: Copy Backend Environment Template
        run: |
          cp stress-detection-system/backend/.env.example stress-detection-system/backend/.env

      - name: Validate Python Syntax and Imports
        working-directory: stress-detection-system/backend
        run: |
          python -m py_compile app/main.py app/services/*.py app/ml/*.py

  frontend-validation:
    name: Frontend CI (React & Tailwind)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'stress-detection-system/frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: stress-detection-system/frontend
        run: npm ci

      - name: Copy Frontend Environment Template
        run: |
          cp stress-detection-system/frontend/.env.example stress-detection-system/frontend/.env

      - name: Test Frontend Build
        working-directory: stress-detection-system/frontend
        run: npm run build
        env:
          CI: false
